server.port=9102
spring.application.name=eureka-server
spring.cloud.config.uri=http://localhost:9101
eureka.client.service-url.defaultZone=http://localhost:9102/eureka/
# Mode Eureka simple (pas de cluster)
eureka.client.registerWithEureka=false
eureka.client.fetchRegistry=false
spring.cloud.config.import-check.enabled=false
# Évite le timeout "Connect to localhost:8761 timed out"
eureka.server.maxThreadsForPeerReplication=0
